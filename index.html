<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020303" />
  <title>JARVIS Voice Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-state="idle">
  <div id="activationOverlay" class="overlay" data-scan-phase="idle">
    <div class="activation-panel">
      <div id="overlayIntro" class="overlay-intro">
        <div class="mini-reactor" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="brand">JARVIS</div>
        <button id="activateBtn" class="activate-btn" type="button">
          Activate Voice Assistant
        </button>
        <p id="activationHint">Grant microphone and camera access to begin your login sequence.</p>
      </div>

      <div id="loginSequence" class="login-sequence" hidden>
        <div class="login-headings">
          <div class="brand">JARVIS</div>
          <div id="loginStatus" class="login-status">Begin Login</div>
          <p id="loginSubstatus" class="login-substatus">Initializing secure access protocol...</p>
        </div>

        <div class="camera-shell">
          <video id="loginVideo" class="login-video" playsinline muted autoplay></video>
          <div class="camera-grid" aria-hidden="true"></div>
          <div class="face-outline" aria-hidden="true"></div>
          <div class="scanline-vertical" aria-hidden="true"></div>
          <div class="scanline-horizontal" aria-hidden="true"></div>
          <div class="camera-readout camera-readout-top">BIOMETRIC LOGIN // SIMULATION</div>
          <div id="loginReadout" class="camera-readout camera-readout-bottom">Awaiting optical lock</div>
        </div>
      </div>
    </div>
  </div>

  <main class="app" aria-label="JARVIS voice assistant">
    <canvas id="starfield"></canvas>
    <canvas id="hologram"></canvas>

    <div class="hud-frame" aria-hidden="true">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line"></div>
    </div>


    <section
      id="videoOverlay"
      class="video-overlay"
      aria-hidden="true"
      aria-label="YouTube video player"
    >
      <div class="video-shell">
        <header class="video-header">
          <div class="video-heading">
            <span class="video-kicker">YOUTUBE // JARVIS MEDIA</span>
            <strong id="videoTitle">YouTube</strong>
            <span id="videoChannel"></span>
          </div>

          <button
            id="closeVideoBtn"
            class="video-close"
            type="button"
            aria-label="Close video"
          >
            ×
          </button>
        </header>

        <div class="video-stage">
          <div id="youtubePlayer"></div>

          <button
            id="manualPlayBtn"
            class="manual-play"
            type="button"
            hidden
          >
            Play Video
          </button>
        </div>

        <footer class="video-footer">
          <span>Say “pause video,” “resume,” “skip ahead,” or “close video.”</span>
          <span id="videoStatus">Ready</span>
        </footer>
      </div>
    </section>

    <div class="status-dot" aria-hidden="true"></div>
  </main>


  <audio
    id="jarvisVoiceAudio"
    preload="auto"
    playsinline
    aria-hidden="true"
  ></audio>

  <button
    id="enableJarvisVoiceBtn"
    class="jarvis-voice-unlock"
    type="button"
    hidden
  >
    Tap to Enable JARVIS Voice
  </button>

  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
